# Site settings — change the title and description to suit your family
title: "Our Family Heritage"
description: "Stories, traditions and memories of our family, past and present, kept for future generations."

# Each person gets their own page from the _people folder
collections:
  people:
    output: true
    permalink: /people/:name/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: people }
    values: { layout: person }

markdown: kramdown
exclude: [README.md]
